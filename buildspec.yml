version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ://amazonaws.com
      - REPOSITORY_URI=://amazonaws.com/brain-tasks-app
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:latest .
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push $REPOSITORY_URI:latest
      - echo Connecting to EKS and Deploying...
      - aws eks update-kubeconfig --region us-east-1 --name brain
      - kubectl apply -f k8s/deployment.yaml
      - kubectl apply -f k8s/service.yaml
